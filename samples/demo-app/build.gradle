plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexusteam.nexatask.demo'
    compileSdk 33

    defaultConfig {
        applicationId "com.nexusteam.nexatask.demo"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':nexatask')
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
